<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riddle Me This 🧠</title>
  <style>
    /* General Body Styling */
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #fdd835, #f06292);
      margin: 0;
      padding: 0;
      color: #222;
    }

    /* Header & Navigation */
    header {
      background: #ff6f00;
      padding: 20px 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 2.2rem;
      color: #fff;
      font-weight: bold;
      text-shadow: 2px 2px #000;
    }

    .navigation ul {
      list-style-type: none;
      display: flex;
      gap: 20px;
    }

    .navigation ul li a {
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      text-decoration: none;
      transition: transform 0.3s ease;
    }

    .navigation ul li a:hover {
      transform: scale(1.2);
      color: #ffeb3b;
    }

    /* Game Container */
    .game-container {
      margin-top: 50px;
      padding: 30px;
      background-color: #fff3e0;
      border-radius: 16px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      font-size: 3rem;
      color: #d81b60;
      margin-bottom: 10px;
    }

    #riddle {
      font-size: 1.4rem;
      margin: 20px;
      color: #5d4037;
    }

    input[type="text"] {
      font-size: 1.2rem;
      padding: 10px;
      width: 60%;
      border: 2px solid #ff6f00;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
      margin: 10px 10px 20px;
      background-color: #ff6f00;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s;
    }

    button:hover {
      background-color: #f4511e;
      transform: scale(1.05);
    }

    #feedback {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 10px;
    }

    #score, #questionNumber {
      font-size: 1.3rem;
      margin-top: 10px;
      color: #6a1b9a;
    }

  </style>
</head>

<body>
  <!-- Navigation Header -->
  <header>
    <nav class="navigation">
      <div class="logo">🎉 Cool Kids Club</div>
      <ul>
        <li><a href="Home.html">Home</a></li>
        <li><a href="Games.html">Games</a></li>
        <li><a href="Leaderboard.html">Leaderboard</a></li>
        <li><a href="Account.html">Account</a></li>
        <li><a href="About Us.html">About Us</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Game Container -->
  <div class="game-container">
    <h1>Riddle Me This! 🤔</h1>
    <div id="riddle">🧠 Loading your brain teaser...</div>

    <!-- Input + Buttons -->
    <input type="text" id="answerInput" placeholder="Type your answer here..." />
    <br>
    <button onclick="checkAnswer()">✅ Submit Answer</button>
    <button onclick="submitScore()">🏆 Submit Score</button>

    <!-- Feedback + Score -->
    <div id="feedback"></div>
    <div id="score">Score: 0</div>
    <div id="questionNumber">Question: 1 / 5</div>
  </div>

  <script>
    // 🧠 Variables to store state
    let currentAnswer = '';
    let score = 0;
    let questionCount = 0;
    const maxQuestions = 5;

    // 🔄 Fetch a random riddle
    async function fetchRiddle() {
      if (questionCount >= maxQuestions) {
        document.getElementById('riddle').textContent = "🎉 Game over! Click '🏆 Submit Score'";
        document.getElementById('answerInput').style.display = 'none';
        return;
      }

      try {
        const response = await fetch('https://riddles-api.vercel.app/random');// open api link
        const data = await response.json();

        document.getElementById('riddle').textContent = "🤔 " + data.riddle;
        currentAnswer = data.answer.toLowerCase();
        document.getElementById('answerInput').value = '';
        document.getElementById('feedback').textContent = '';
        document.getElementById('answerInput').style.display = 'inline';
      } catch (err) {
        document.getElementById('riddle').textContent = '🚫 Failed to load riddle. Try again!';
        console.error(err);
      }
    }

    // ✅ Check if the answer is correct
    function checkAnswer() {
      const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase();
      if (!userAnswer) {
        document.getElementById('feedback').textContent = '⚠️ Please enter an answer!';
        return;
      }

      // Update question number
      questionCount++;
      document.getElementById('questionNumber').textContent = `Question: ${Math.min(questionCount + 1, maxQuestions)} / ${maxQuestions}`;

      if (userAnswer === currentAnswer) {
        score++;
        document.getElementById('feedback').textContent = '🎉 Correct! Great job!';
      } else {
        document.getElementById('feedback').textContent = `😢 Oops! The answer was: ${currentAnswer}`;
      }

      document.getElementById('score').textContent = `Score: ${score}`;

      // Load next riddle or end game
      if (questionCount < maxQuestions) {
        fetchRiddle();
      } else {
        document.getElementById('riddle').textContent = "🎮 Game Over! Click '🏆 Submit Score'";
        document.getElementById('answerInput').style.display = 'none';
      }
    }

    // 🏆 Submit score to localStorage
    function submitScore() {
      const user = localStorage.getItem('loggedInUser');
      if (!user) {
        alert('🚫 You must be logged in to submit your score!');
        return;
      }

      if (questionCount < maxQuestions) {
        alert('⏳ Finish all riddles before submitting your score!');
        return;
      }

      const scores = JSON.parse(localStorage.getItem('scores')) || [];
      const existing = scores.find(s => s.name === user);

      if (existing) {
        existing.score = Math.max(existing.score, score);
      } else {
        scores.push({ name: user, score });
      }

      localStorage.setItem('scores', JSON.stringify(scores));
      alert(`✅ Score submitted! Final Score: ${score}`);
    }

    // 🎬 Start game on load
    fetchRiddle();
  </script>
</body>
</html>
